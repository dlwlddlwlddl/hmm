<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QUEEN | Members</title>

  <style>
    /* 기본 세팅 */
    *{margin:0;padding:0;box-sizing:border-box;}
    
    body{
      background-image:url("chest-top-view.png"); /* 페이지 전체 배경 */
      background-size:cover;
      background-position:center top;
      background-repeat:no-repeat;
      background-attachment:fixed;
      color:#f7f4e9;
      font-family:"Times New Roman",serif;
      padding-top:80px; /* 헤더 높이 */
    }

    a{text-decoration:none;color:inherit;}

    /* ===== 공통 네비 (앨범 소개와 동일) ===== */
    .site-header{
      position:fixed;top:0;left:0;right:0;
      height:80px;
      display:flex;align-items:center;justify-content:space-between;
      padding:0 40px;
      background:rgba(10,5,4,0.92);
      backdrop-filter:blur(8px);
      border-bottom:1px solid rgba(255,255,255,0.06);
      z-index:100;
    }

    .logo{
      font-size:22px;
      letter-spacing:0.25em;
      text-transform:uppercase;
    }

    .main-nav{
      display:flex;
      gap:26px;
      font-size:13px;
      letter-spacing:0.12em;
      text-transform:uppercase;
    }
    .main-nav a{
      position:relative;
      padding-bottom:3px;
    }
    .main-nav a::after{
      content:"";
      position:absolute;left:0;bottom:0;
      width:0;height:2px;background:#f7f4e9;
      transition:width .25s;
    }
    .main-nav a:hover::after{
      width:100%;
    }

    .site-search{
      display:flex;align-items:center;gap:6px;font-size:11px;
    }
    .site-search input{
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.2);
      border-radius:999px;padding:6px 10px;
      color:#f7f4e9;width:150px;
    }
    .site-search button{
      border:none;border-radius:999px;
      padding:6px 12px;font-size:10px;
      background:#f7f4e9;color:#120a06;
      text-transform:uppercase;
      cursor:pointer;
    }

    /* ===== Hero ===== */
    .hero{
      text-align:center;
      margin-top:80px;
      margin-bottom:40px;
      padding:0 20px;
    }
    .hero h1{
      font-size:42px;
      letter-spacing:0.28em;
      text-transform:uppercase;
      margin-bottom:10px;
      text-shadow:0 2px 10px rgba(0,0,0,0.7);
    }
    .hero p{
      font-size:15px;
      opacity:0.8;
      text-shadow:0 2px 10px rgba(0,0,0,0.5);
    }

    /* ===== Member Cards ===== */
    .members-wrap{
      max-width:1200px;
      margin:0 auto 100px;
      padding:0 40px;
    }
    .member-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:26px;
    }

    @media(max-width:1024px){
      .member-grid{grid-template-columns:repeat(2,1fr);}
    }
    @media(max-width:640px){
      .member-grid{grid-template-columns:1fr;}
    }

    .member-card{
      background:rgba(18,10,7,0.8);
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.12);
      padding:18px;
      text-align:center;
      transition:0.25s;
      backdrop-filter:blur(4px);
    }
    .member-card:hover{
      transform:translateY(-6px);
      box-shadow:0 14px 26px rgba(0,0,0,0.8);
      border-color:#f7f4e9;
    }

    .member-card img{
      width:100%;
      border-radius:10px;
      margin-bottom:12px;
    }
    .member-name{
      font-size:18px;
      letter-spacing:0.12em;
      text-transform:uppercase;
      margin-bottom:4px;
    }
    .member-role{
      font-size:13px;
      opacity:0.8;
      margin-bottom:8px;
    }

  </style>
</head>

<body>

  <!-- ===== NAVIGATION ===== -->
  <header class="site-header">
    <div class="logo">QUEEN</div>
    <nav class="main-nav">
      <a href="밴드소개.html">밴드소개</a>
      <a href="albums.html">앨범소개</a>
      <a href="members.html">구성원</a>
      <a href="history.html">그들의 역사</a>
    </nav>

    <form class="site-search">
      <input type="search" placeholder="검색…" />
      <button type="button">Search</button>
    </form>
  </header>

  <!-- ===== HERO ===== -->
  <section class="hero">
    <h1>MEMBERS</h1>
    <p>퀸을 완성한 네 명의 멤버</p>
  </section>

  <!-- ===== MEMBER CARDS ===== -->
 <section class="members-wrap">
  <div class="member-grid">

    <a class="member-card" href="freddie.html">
      <img src="프레디.png">
      <div class="member-name">Freddie Mercury</div>
      <div class="member-role">Vocal · Piano</div>
    </a>

    <a class="member-card" href="brian.html">
      <img src="브라이언.png">
      <div class="member-name">Brian May</div>
      <div class="member-role">Guitar</div>
    </a>

    <a class="member-card" href="john.html">
      <img src="리처드.png">
      <div class="member-name">John Deacon</div>
      <div class="member-role">Bass</div>
    </a>

    <a class="member-card" href="roger.html">
      <img src="로저.png">
      <div class="member-name">Roger Taylor</div>
      <div class="member-role">Drums</div>
    </a>

  </div>
</section>


</body>
</html>
