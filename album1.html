<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QUEEN | Album 1</title>

  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      background-image:url("chest-top-view.png");
      background-size:cover;
      background-position:center top;
      background-repeat:no-repeat;
      background-attachment:fixed;
      color:#f7f4e9;
      font-family:"Times New Roman",serif;
      padding-top:80px;
    }
    a{text-decoration:none;color:inherit;}

    .site-header{
      position:fixed;top:0;left:0;right:0;
      height:80px;
      display:flex;align-items:center;justify-content:space-between;
      padding:0 40px;
      background:rgba(10,5,4,0.92);
      backdrop-filter:blur(8px);
      border-bottom:1px solid rgba(255,255,255,0.06);
      z-index:100;
    }
    .logo{
      font-size:22px;
      letter-spacing:0.25em;
      text-transform:uppercase;
    }
    .main-nav{
      display:flex;gap:26px;
      font-size:13px;letter-spacing:0.12em;text-transform:uppercase;
    }
    .main-nav a{position:relative;padding-bottom:3px;}
    .main-nav a::after{
      content:"";position:absolute;left:0;bottom:0;
      width:0;height:2px;background:#f7f4e9;transition:width .25s;
    }
    .main-nav a:hover::after{width:100%;}

    .site-search{display:flex;align-items:center;gap:6px;font-size:11px;}
    .site-search input{
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.2);
      border-radius:999px;padding:6px 10px;
      color:#f7f4e9;width:150px;
    }
    .site-search button{
      border:none;border-radius:999px;padding:6px 12px;
      font-size:10px;background:#f7f4e9;color:#120a06;
      text-transform:uppercase;cursor:pointer;
    }
    .album-hero{
      max-width:1100px;
      margin:90px auto 60px;
      padding:0 40px;
      display:grid;
      grid-template-columns:1.1fr 1fr;
      gap:40px;
      align-items:center;
    }
    @media(max-width:900px){
      .album-hero{grid-template-columns:1fr;}
    }

    .album-cover{
      background:rgba(10,5,4,0.85);
      padding:18px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,0.18);
      box-shadow:0 18px 40px rgba(0,0,0,0.9);
    }
    .album-cover img{
      width:100%;
      border-radius:12px;
      display:block;
    }

    .album-meta-title{
      font-size:26px;
      letter-spacing:0.18em;
      text-transform:uppercase;
      margin-bottom:10px;
      text-shadow:0 2px 10px rgba(0,0,0,0.8);
    }
    .album-meta-sub{
      font-size:14px;
      opacity:0.85;
      margin-bottom:16px;
    }
    .album-meta-info{
      font-size:13px;
      opacity:0.9;
      line-height:1.7;
      margin-bottom:20px;
    }
    .tracks{
      max-width:1100px;
      margin:0 auto 80px;
      padding:0 40px 10px;
      background:rgba(10,5,4,0.78);
      border-radius:16px;
      border:1px solid rgba(255,255,255,0.14);
      box-shadow:0 14px 30px rgba(0,0,0,0.85);
    }
    .tracks-title{
      padding:16px 20px 10px;
      font-size:15px;
      letter-spacing:0.18em;
      text-transform:uppercase;
      opacity:0.9;
    }
    .track-list{
      list-style:none;
      padding:0 20px 18px 28px;
      font-size:14px;
      opacity:0.92;
      line-height:1.8;
    }

    /* 하단 버튼 */
    .nav-back{
      max-width:1100px;
      margin:0 auto 90px;
      padding:0 40px;
      display:flex;
      justify-content:space-between;
      gap:16px;
    }
    .btn-ghost{
      border:1px solid #f7f4e9;
      border-radius:999px;
      padding:9px 22px;
      font-size:11px;
      letter-spacing:0.14em;
      text-transform:uppercase;
      background:rgba(10,5,4,0.6);
      transition:0.25s;
    }
    .btn-ghost:hover{
      background:#f7f4e9;
      color:#000;
    }

  </style>
</head>
<body>

  <!-- NAV -->
  <header class="site-header">
    <div class="logo">QUEEN</div>
    <nav class="main-nav">
      <a href="밴드소개.html">밴드소개</a>
      <a href="albums.html">앨범소개</a>
      <a href="구성원.html">구성원</a>
      <a href="history.html">그들의 역사</a>
    </nav>
    <form class="site-search">
      <input type="search" placeholder="검색…" />
      <button type="button">Search</button>
    </form>
  </header>

  <section class="album-hero">
    <div class="album-cover">
      <img src="q.png" alt="Queen Album 1 Cover">
    </div>

    <div>
      <div class="album-meta-title">News of the World (1977)</div>
      <div class="album-meta-sub">1977년</div>
      <p class="album-meta-info">
        록 역사에 남은 대표곡 "We Will Rock You", "We Are the Champions"가 수록된 명반.
강렬한 리듬과 거대한 사운드로 Queen의 대중성과 라이브 에너지를 완전히 증명한 작품
      </p>
    </div>
  </section>

  <section class="tracks">
    <div class="tracks-title">TRACK LIST</div>
    <ol class="track-list">
      <li>Track 1</li>
      <li>Track 2</li>
      <li>Track 3</li>
      <li>Track 4</li>
      <li>Track 5</li>
    </ol>
  </section>

  <!-- 하단 네비 -->
  <div class="nav-back">
    <a class="btn-ghost" href="albums.html">← 앨범 목록으로</a>
    <a class="btn-ghost" href="album2.html">다음 앨범 보기 →</a>
  </div>

</body>
</html>
