<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>QUEEN | Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background-color: #050302;
      color: #f5ecdd;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 32px;
      width: 100%;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      background: rgba(5, 3, 2, 0.92);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
    }

    .nav {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-family: "Times New Roman", serif;
      font-size: 22px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
    }

    .nav-center {
      display: flex;
      gap: 28px;
      font-size: 15px;
    }

    .nav-center a {
      position: relative;
      transition: color 0.18s ease, transform 0.18s ease;
    }

    .nav-center a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -6px;
      width: 0;
      height: 1px;
      background: #f5ecdd;
      transition: width 0.2s ease-out;
    }

    .nav-center a:hover {
      transform: translateY(-1px);
      color: #ffffff;
    }

    .nav-center a:hover::after {
      width: 100%;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    .search-input {
      width: 170px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: #120a07;
      color: #f5ecdd;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .search-input::placeholder {
      color: #b9aa94;
    }

    .search-input:focus {
      border-color: #f5ecdd;
      box-shadow: 0 0 0 2px rgba(245, 236, 221, 0.25);
    }

    .search-btn {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid #f5ecdd;
      background: #f5ecdd;
      color: #120a07;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease,
        transform 0.18s ease, box-shadow 0.18s ease;
    }

    .search-btn:hover {
      background: #fff5dd;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
      transform: translateY(-2px);
    }

    .search-btn:active {
      transform: translateY(0);
      box-shadow: none;
    }

    @media (max-width: 900px) {
      .nav-center {
        display: none;
      }
      .search-input {
        width: 120px;
      }
    }


    .hero {
      position: relative;
      min-height: 100vh;
      padding-top: 72px; 
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("bg.png");
      background-size: cover;
      background-position: center;
      filter: brightness(0.7);
      z-index: -2;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 30%, rgba(0, 0, 0, 0.75));
      z-index: -1;
    }

    .hero-inner {
      text-align: center;
      padding: 40px 20px 80px;
    }

    .hero-kicker {
      font-size: 12px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: #e1d2b5;
      margin-bottom: 12px;
    }

    .hero-title {
      font-family: "Times New Roman", serif;
      font-size: clamp(40px, 6vw, 60px);
      letter-spacing: 0.4em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .hero-sub {
      font-size: 14px;
      color: #e9dcc6;
      max-width: 520px;
      margin: 0 auto 24px;
      line-height: 1.6;
    }

    .hero-buttons {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .btn-main {
      border-radius: 999px;
      padding: 10px 22px;
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      background: #f5ecdd;
      color: #120a07;
      font-weight: 700;
      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        background 0.18s ease,
        color 0.18s ease;
    }

    .btn-main:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.6);
      background: #fff5dd;
    }

    .btn-main:active {
      transform: translateY(0);
      box-shadow: none;
      background: #e8dcc6;
    }

    .hero-note {
      font-size: 11px;
      color: #d1c3aa;
      margin-top: 6px;
    }

    footer {
      padding: 18px 0 22px;
      text-align: center;
      font-size: 11px;
      color: #cbb99a;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      background: #050302;
    }
  </style>
</head>

<body>
  <div class="page">
    <header>
      <div class="container nav">
        <div class="brand">QUEEN</div>

        <nav class="nav-center">
          <a href="밴드소개.html">밴드소개</a>
          <a href="albums.html">앨범소개</a>
          <a href="구성원.html">구성원</a>
          <a href="구성원.html">그들의 역사</a>
        </nav>

        <div class="nav-right">
          <input class="search-input" type="text" placeholder="검색..." />
          <button class="search-btn">SEARCH</button>
        </div>
      </div>
    </header>

    <section class="hero">
      <div class="hero-inner">
        <div class="hero-kicker">THE LEGEND</div>
        <h1 class="hero-title">QUEEN</h1>
        <p class="hero-sub">
          Who is QUEEN: Band Archive Website
        </p>

  
        <div class="hero-buttons">
          <a href="밴드소개.html" class="btn-main">밴드소개</a>
          <a href="albums.html" class="btn-main">앨범소개</a>
          <a href="구성원.html" class="btn-main">구성원</a>
          <a href="history.html" class="btn-main">그들의 역사</a>
        </div>
      </div>
    </section>

    <footer>
      © 2025 QUEEN WEB PROJECT · For educational use only.
    </footer>
  </div>
</body>
</html>
