<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QUEEN | Brian May</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      background-image:url("chest-top-view.png");
      background-size:cover;
      background-position:center top;
      background-repeat:no-repeat;
      background-attachment:fixed;
      color:#f7f4e9;
      font-family:"Times New Roman",serif;
      padding-top:80px;
    }
    a{text-decoration:none;color:inherit;}

    .site-header{
      position:fixed;top:0;left:0;right:0;
      height:80px;
      display:flex;align-items:center;justify-content:space-between;
      padding:0 40px;
      background:rgba(10,5,4,0.92);
      backdrop-filter:blur(8px);
      border-bottom:1px solid rgba(255,255,255,0.06);
      z-index:100;
    }
    .logo{font-size:22px;letter-spacing:0.25em;text-transform:uppercase;}
    .main-nav{
      display:flex;gap:26px;
      font-size:13px;letter-spacing:0.12em;text-transform:uppercase;
    }
    .main-nav a{position:relative;padding-bottom:3px;}
    .main-nav a::after{
      content:"";position:absolute;left:0;bottom:0;width:0;height:2px;
      background:#f7f4e9;transition:width .25s;
    }
    .main-nav a:hover::after{width:100%;}

    .site-search{
      display:flex;align-items:center;gap:6px;font-size:11px;
    }
    .site-search input{
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.2);
      border-radius:999px;padding:6px 10px;
      color:#f7f4e9;width:150px;
    }
    .site-search button{
      border:none;border-radius:999px;padding:6px 12px;font-size:10px;
      background:#f7f4e9;color:#120a06;text-transform:uppercase;cursor:pointer;
    }

    .hero{
      max-width:1100px;margin:90px auto 40px;
      padding:0 40px;
      display:grid;grid-template-columns:1.2fr 1fr;gap:40px;
      align-items:center;
    }
    @media(max-width:900px){
      .hero{grid-template-columns:1fr;}
    }
    .hero img{
      width:100%;border-radius:12px;
      box-shadow:0 14px 30px rgba(0,0,0,0.85);
    }
    .hero-title{
      font-size:32px;letter-spacing:0.22em;text-transform:uppercase;margin-bottom:10px;
      text-shadow:0 2px 10px rgba(0,0,0,0.8);
    }
    .hero-role{
      font-size:14px;opacity:0.85;margin-bottom:18px;
      letter-spacing:0.16em;text-transform:uppercase;
    }
    .hero-text{
      font-size:15px;opacity:0.9;line-height:1.7;
    }

    .nav-back{
      max-width:1100px;margin:0 auto 80px;padding:0 40px;
      display:flex;justify-content:space-between;gap:16px;
    }
    .btn-ghost{
      border:1px solid #f7f4e9;border-radius:999px;
      padding:8px 20px;font-size:11px;letter-spacing:0.14em;
      text-transform:uppercase;transition:.25s;
      background:rgba(10,5,4,0.6);
    }
    .btn-ghost:hover{
      background:#f7f4e9;color:#000;
    }
  </style>
</head>
<body>
  <!-- header 부분은 freddie.html과 동일 -->
  <header class="site-header">
    <div class="logo">QUEEN</div>
    <nav class="main-nav">
      <a href="밴드소개.html">밴드소개</a>
      <a href="albums.html">앨범소개</a>
      <a href="members.html">구성원</a>
      <a href="history.html">그들의 역사</a>
    </nav>
    <form class="site-search">
      <input type="search" placeholder="검색…" />
      <button type="button">Search</button>
    </form>
  </header>

  <section class="hero">
    <img src="br.png" alt="Brian May">
    <div>
      <div class="hero-title">Brian May</div>
      <div class="hero-role">Guitar</div>
      <p class="hero-text">
        직접 만든 레드 스페셜 기타와 독특한 톤으로 퀸의 사운드를 완성한 기타리스트.
        서사적인 솔로와 섬세한 편곡으로 밴드의 곡에 깊이를 더했다.
      </p>
    </div>
  </section>

  <div class="nav-back">
    <a class="btn-ghost" href="freddie.html">← 이전 멤버: Freddie</a>
    <a class="btn-ghost" href="john.html">다음 멤버: John Deacon →</a>
  </div>
</body>
</html>
